<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="../../manifest.webmanifest"><link rel="stylesheet" href="../../pwa.css">
    <link rel="stylesheet" href="../module-shell.css"><link rel="stylesheet" href="./eventos.css">
    <title>Eventos y cultos - Mi Iglesia</title>
</head>
<body>
<header class="module-header"><div class="module-header-inner">
    <a class="module-brand" href="../../Inicio.html"><img src="../../src/images/Logo/LOGO_Blanco.png" alt=""><span>Mi Iglesia</span></a>
    <div class="module-user"><span><strong data-module-user></strong><br><small data-module-role></small></span><button class="module-logout" data-module-logout>Cerrar sesión</button></div>
</div>
        <div class="module-intro">
            <p>EVENTOS Y CULTOS</p>
            <h1>Preparemos cada encuentro.</h1>
            <span>Consulta la agenda, los detalles y el equipo de cada servicio.</span>
        </div>
</header>
<main class="module-main">
    <nav class="module-nav" aria-label="Módulos">
        <a href="../../Inicio.html">Inicio</a><a href="./Eventos.html" aria-current="page">Eventos y cultos</a>
        <a href="../Peticiones/Peticiones.html">Peticiones</a><a href="../Cuenta/Cuenta.html">Mi cuenta</a>
        <a href="../Coordinacion/Coordinacion.html" data-required-areas="2,5">Coordinación</a><a href="../Repertorio/Repertorio.html" data-required-areas="1,2,3,5">Repertorio</a>
        <a href="../Multimedia/Multimedia.html" data-required-areas="2,3,5">Multimedia</a><a href="../Sonido/Sonido.html" data-required-areas="2,4,5">Sonido</a><a href="../Administracion/Administracion.html" data-required-area="5">Administración</a>
    </nav>
    <section class="module-card" data-required-areas="2,5" hidden>
        <h2>Programar evento</h2><form class="module-form" id="eventForm">
            <input name="id" type="hidden"><label class="module-field full">Nombre<input name="title" maxlength="120" required></label>
            <label class="module-field">Tipo<select name="eventType"><option>Culto</option><option>Ensayo</option><option>Evento especial</option></select></label>
            <label class="module-field">Fecha y hora<input name="startsAt" type="datetime-local" required></label>
            <label class="module-field full">Detalles<textarea name="details" maxlength="2000"></textarea></label>
            <label class="module-field full">Imagen del programa (opcional)<input name="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp"></label>
            <button class="module-button" type="submit">Guardar evento</button><button class="module-button secondary" id="cancelEvent" type="button" hidden>Cancelar</button>
        </form><p class="module-status" id="eventStatus" role="status"></p>
    </section>
    <section class="module-card"><h2>Próximos servicios</h2><p class="module-status" id="servicesStatus"></p><div class="module-list" id="serviceList"></div></section>
</main>
<script src="../../api-config.js"></script><script src="../../app.js"></script><script src="../module-shell.js"></script><script src="./eventos.js"></script><script src="../../pwa.js"></script>
</body></html>
