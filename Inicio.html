<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000e29">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Iglesia">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/src/images/Logo/apple-touch-icon.png">
    <link rel="stylesheet" href="/pwa.css">
    <link rel="stylesheet" href="/frontend/Repertorio/repertorio-viewer.css">
    <title>Inicio - Mi Iglesia</title>
    <style>
        :root {
            --navy: #000e29;
            --blue: #2929fd;
            --steel: #bcd7f7;
            --cream: #f3f7fc;
            --ink: #000e29;
            --muted: #64748b;
            --line: #dfe8f4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background:
                radial-gradient(ellipse at 100% 0%, rgba(188,215,247,.65), transparent 32%),
                var(--cream);
            color: var(--ink);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .hero {
            padding: 23px 22px 80px;
            color: white;
            background:
                radial-gradient(ellipse at 5% 110%, rgba(41,41,253,.92), transparent 38%),
                radial-gradient(ellipse at 47% 120%, rgba(31,117,237,.72), transparent 43%),
                radial-gradient(circle at 89% 28%, rgba(255,255,255,.08) 0 100px, transparent 101px),
                linear-gradient(135deg, #000719, var(--navy) 62%, #001b43);
        }

        .nav, main {
            width: min(100%, 1040px);
            margin: 0 auto;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 800;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .nav-right {
            display: flex;
            min-width: 0;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-right span {
            max-width: 100%;
            color: rgba(255,255,255,.82);
            font-size: 13px;
            overflow-wrap: anywhere;
            text-align: right;
        }

        .logout {
            min-height: 38px;
            padding: 0 13px;
            border: 1px solid rgba(255,255,255,.4);
            border-radius: 10px;
            background: transparent;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        .welcome {
            display: flex;
            width: min(100%, 1040px);
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin: 42px auto 0;
        }

        .welcome > div { min-width: 0; }

        .welcome p {
            margin: 0 0 8px;
            color: var(--steel);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .13em;
            text-transform: uppercase;
        }

        h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; }

        h1 {
            margin: 0;
            font-size: clamp(29px, 5vw, 43px);
            overflow-wrap: anywhere;
        }

        .role-badge {
            display: inline-block;
            max-width: 100%;
            padding: 8px 13px;
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 999px;
            background: rgba(255,255,255,.1);
            color: var(--steel);
            font-size: 13px;
            font-weight: 700;
            overflow-wrap: anywhere;
            text-align: center;
        }

        main {
            padding: 0 22px 56px;
            margin-top: -48px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 13px;
            margin-bottom: 22px;
        }

        .stat {
            padding: 17px;
            border: 1px solid rgba(255,255,255,.28);
            border-radius: 17px;
            background: var(--navy);
            color: white;
            text-align: center;
            box-shadow: 0 9px 24px rgba(20,39,83,.13);
        }

        .stat strong {
            display: block;
            color: var(--steel);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 25px;
        }

        .stat span { color: rgba(255,255,255,.84); font-size: 12px; }

        .announcement {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 20px;
            padding: 25px;
            border-radius: 20px;
            background:
                radial-gradient(ellipse at 5% 10%, rgba(41,41,253,.94), transparent 54%),
                linear-gradient(120deg, #000e29, #153b82);
            box-shadow: 0 13px 26px rgba(0,14,41,.18);
        }

        .announcement .tag {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            background: rgba(255,255,255,.48);
            color: var(--navy);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .announcement h2 {
            margin: 12px 0 7px;
            color: var(--cream);
            font-size: 25px;
        }

        .announcement p { margin: 0;         color: rgba(255,255,255,.9); line-height: 1.5; }

        .announcement-icon {
            display: grid;
            width: 64px;
            height: 64px;
            place-items: center;
            border-radius: 19px;
            background: rgba(255,255,255,.33);
            color: var(--navy);
            font-size: 31px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-top: 18px;
        }

        .panel {
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: white;
            box-shadow: 0 8px 22px rgba(32,54,111,.06);
        }

        .panel h2 { margin: 0 0 8px; color: var(--navy); font-size: 21px; }
        .panel p { margin: 0; color: var(--muted); line-height: 1.55; }
        .panel .date {         color: var(--blue); font-size: 12px; font-weight: 800; text-transform: uppercase; }

        .admin-panel { margin-top: 20px; }
        .admin-heading { display:flex; align-items:start; justify-content:space-between; gap:16px; margin-bottom:16px; }
        .admin-heading p { margin-top:5px; }
        .status { min-height:20px; margin:10px 0; color:#31539b; font-size:13px; }
        .user-list { display:grid; gap:10px; }
        .user-row {
            display:grid;
            grid-template-columns:minmax(180px, .9fr) minmax(280px, 1.8fr) auto;
            grid-template-areas:"identity roles save" "credentials credentials credentials";
            align-items:center;
            gap:14px 18px;
            padding:17px;
            border:1px solid var(--line);
            border-radius:15px;
            background:linear-gradient(135deg, #fff, #f8faff);
        }
        .user-identity { grid-area:identity; min-width:0; }
        .user-credentials { grid-area:credentials; display:flex; align-items:center; gap:9px; padding-top:12px; border-top:1px solid var(--line); }
        .user-credentials input { width:min(100%, 300px); min-height:38px; padding:8px 11px; border:1px solid #d8deea; border-radius:9px; font:inherit; }
        .user-row > .role-options { grid-area:roles; align-content:center; gap:8px; }
        .user-row > .save-role { grid-area:save; white-space:nowrap; }
        .user-name { color:var(--navy); font-weight:700; }
        .user-meta { margin-top:3px; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
        .role-options {
            display:flex;
            flex-wrap:wrap;
            gap:8px 10px;
            min-width:0;
            margin:0;
            padding:0;
            border:0;
        }
        .role-options legend { flex:0 0 100%; margin-bottom:3px; color:var(--muted); font-size:12px; font-weight:700; }
        .role-option, .form-field.role-option { display:flex; align-items:center; gap:8px; color:var(--ink); font-size:13px; }
        .role-option { padding:7px 10px; border:1px solid var(--line); border-radius:999px; background:#fff; }
        .role-option input { width:16px; height:16px; flex:0 0 auto; margin:0; accent-color:var(--blue); }
        .role-options.create-role-options { display:flex; gap:9px; padding:4px 0; }
        .create-role-options .role-option { min-height:38px; }
        .save-role {
            min-height:38px;
            padding:0 13px;
            border:0;
            border-radius:9px;
            background:var(--blue);
            color:white;
            font-weight:700;
            cursor:pointer;
        }
        .save-role:disabled { opacity:.55; cursor:not-allowed; }
        .management-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
        .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .password-form { margin-top:16px; }
        .profile-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:16px; }
        .profile-actions .action-button { width:100%; }
        .profile-notification-control { display:grid; gap:7px; }
        .profile-notification-control .status { margin:0; }
        .form-field { display:grid; gap:5px; color:var(--muted); font-size:13px; }
        .form-field input, .form-field select, .form-field textarea {
            width:100%; min-height:40px; padding:9px 11px; border:1px solid #d8deea;
            border-radius:9px; background:#fff; color:var(--ink); font:inherit;
        }
        .form-field textarea { min-height:76px; resize:vertical; }
        .form-help { color:var(--muted); font-size:11px; line-height:1.45; }
        .song-composer { display:grid; gap:10px; }
        .song-composer-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
        .song-composer-toolbar button, .song-chord-suggestion { min-height:32px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--navy); font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
        .song-composer-toolbar button:hover, .song-chord-suggestion:hover { border-color:#69b4e7; background:#eff8ff; }
        .song-paste-input { min-height:90px; }
        .song-line-editor { display:grid; gap:8px; }
        .song-line-row { display:grid; grid-template-columns:minmax(120px,.8fr) minmax(0,2fr) auto; gap:8px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:10px; background:#f8fbff; }
        .song-line-row input { width:100%; min-height:36px; padding:7px 9px; border:1px solid rgba(106,142,174,.28); border-radius:8px; background:#fff; color:var(--ink); font:inherit; }
        .song-line-chord { font-weight:700; }
        .song-line-editor.lyrics-only .song-line-row { grid-template-columns:minmax(0,1fr) auto; }
        .song-line-editor.lyrics-only .song-line-chord { display:none; }
        .song-line-remove { padding:0; border:0; background:none; color:#9b2631; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
        .song-chord-suggestions { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
        .song-chord-suggestions span { color:var(--muted); font-size:11px; }
        .song-composer-empty { margin:0; color:var(--muted); font-size:12px; }
        .form-field.full { grid-column:1 / -1; }
        .action-button {
            min-height:40px; padding:0 14px; border:0; border-radius:9px;
            background:var(--blue); color:#fff; font:inherit; font-weight:700; cursor:pointer;
        }
        .action-button:disabled { opacity:.55; cursor:wait; }
        .service-list, .directory-list, .audit-list { display:grid; gap:10px; }
        .service-card, .directory-row, .audit-row {
            padding:14px; border:1px solid var(--line); border-radius:12px; background:#fff;
        }
        .service-card h3 { margin:0 0 5px; color:var(--navy); font-size:18px; }
        .service-date, .service-details, .audit-details { color:var(--muted); font-size:13px; }
        .service-disclosure > summary {
            display:flex; align-items:center; justify-content:space-between; gap:14px;
            list-style:none; cursor:pointer;
        }
        .service-disclosure > summary::-webkit-details-marker { display:none; }
        .service-disclosure > summary:focus-visible { outline:3px solid #65b7ff; outline-offset:4px; border-radius:5px; }
        .service-summary-heading { min-width:0; }
        .service-summary-heading h3 { margin-bottom:5px; }
        .service-summary-heading .service-date { color:var(--muted); }
        .service-disclosure-label { flex:0 0 auto; color:var(--blue); font-size:13px; font-weight:700; }
        .service-expanded-content { display:grid; gap:12px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line); }
        .service-expanded-content .feed-image { margin-top:0; }
        .service-expanded-section h4 { margin:0 0 7px; color:var(--navy); font-size:14px; }
        .service-expanded-section p { margin:0; white-space:pre-wrap; }
        .service-song-list { display:grid; gap:5px; margin:0; padding-left:20px; color:var(--muted); font-size:13px; }
        .assignment-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
        .assignment-chip {
            display:inline-flex; align-items:center; gap:7px; padding:6px 9px;
            border-radius:999px; background:#edf3ff; color:var(--navy); font-size:12px;
        }
        .assignment-draft-list { display:grid; gap:8px; margin-top:10px; }
        .assignment-draft { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-size:13px; }
        .assignment-draft-empty { margin:8px 0 0; color:var(--muted); font-size:13px; }
        .assignment-draft-actions { display:grid; gap:8px; margin-top:12px; }
        .whatsapp-consent { display:flex; align-items:flex-start; gap:9px; color:var(--muted); line-height:1.5; }
        .whatsapp-consent.full { grid-column:1 / -1; }
        .whatsapp-consent input { width:17px; height:17px; flex:0 0 auto; margin:2px 0 0; accent-color:var(--blue); }
        [data-view-section]:not([hidden]) { animation:section-enter .26s ease-out both; }
        @keyframes section-enter { from { opacity:0; transform:translateY(9px); } to { opacity:1; transform:translateY(0); } }
        .remove-assignment {
            padding:0; border:0; background:none; color:#9b2631; font:inherit; font-weight:700; cursor:pointer;
        }
        .role-access { margin-top:20px; }
        .role-access h2 { margin-top:0; }
        .role-access ul { margin:10px 0 0; padding-left:20px; color:var(--muted); line-height:1.7; }
        .empty-state { color:var(--muted); font-size:14px; }
        .status { overflow-wrap:anywhere; }
        .app-menu { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; padding:12px; border:1px solid var(--line); border-radius:14px; background:#fff; }
        .menu-link { min-height:38px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--navy); font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
        .menu-link[aria-current="page"] { border-color:var(--blue); background:#edf3ff; color:var(--blue); }
        .mobile-menu-toggle, .mobile-menu-backdrop, .mobile-menu-heading { display:none; }
        .feed-list { display:grid; gap:10px; margin-top:12px; }
        .feed-card { padding:14px; border:1px solid var(--line); border-radius:12px; background:#fff; }
        .feed-card h3 { margin:0 0 6px; color:var(--navy); font-size:18px; }
        .feed-meta { margin-top:7px; color:var(--muted); font-size:12px; }
        .feed-card p { white-space:pre-wrap; }
        .inline-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .text-link { color:var(--blue); font-weight:700; overflow-wrap:anywhere; }
        .prayer-pending { border-left:4px solid #e6a700; }
        .notification-count { display:inline-grid; min-width:20px; height:20px; place-items:center; padding:0 5px; border-radius:999px; background:#b42318; color:white; font-size:11px; }
        .directory-group { margin-top:18px; }
        .directory-search { width:100%; min-height:40px; margin:10px 0; padding:9px 11px; border:1px solid #d8deea; border-radius:9px; font:inherit; }
        .song-search { width:100%; min-height:44px; margin:14px 0 8px; padding:10px 13px; border:1px solid #d8deea; border-radius:11px; background:#fff; color:var(--ink); font:inherit; }
        .song-results-meta { margin:0 0 6px !important; color:var(--muted); font-size:12px; }
        .song-activity { display:grid; gap:9px; margin:18px 0 14px; padding:15px; border:1px solid rgba(106,142,174,.2); border-radius:15px; background:linear-gradient(135deg,#f2f8ff,#fff); }
        .song-activity h3 { margin:0; color:var(--navy); font-size:16px; }
        .song-activity-list { display:grid; gap:7px; }
        .song-activity-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; }
        .song-activity-name { min-width:0; color:var(--ink); font-size:13px; font-weight:700; overflow-wrap:anywhere; }
        .song-activity-meta { flex:0 0 auto; color:var(--muted); font-size:11px; text-align:right; }
        .song-activity-badge { display:inline-block; margin-right:6px; padding:3px 7px; border-radius:999px; background:#e5f5ec; color:#197044; font-size:10px; font-weight:800; text-transform:uppercase; }
        .song-activity-badge.updated { background:#e8f1ff; color:#2860a8; }
        .song-table-wrap { overflow-x:auto; margin-top:12px; border:1px solid var(--line); border-radius:13px; background:#fff; }
        .song-table { width:100%; border-collapse:collapse; text-align:left; }
        .song-table th, .song-table td { padding:12px 13px; border-bottom:1px solid var(--line); vertical-align:top; }
        .song-table tbody tr:last-child td { border-bottom:0; }
        .song-table tbody tr:nth-child(even) { background:#f8faff; }
        .song-table th { color:var(--navy); font-size:13px; }
        .song-table td { color:var(--muted); font-size:13px; }
        .song-title-button { padding:0; border:0; background:none; color:var(--navy); font:inherit; font-weight:700; text-align:left; cursor:pointer; }
        .song-title-button:hover { color:var(--blue); text-decoration:underline; }
        .song-pagination { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:13px; }
        .song-pagination button { min-height:36px; padding:0 13px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--navy); font:inherit; font-weight:700; cursor:pointer; }
        .song-pagination button:disabled { opacity:.45; cursor:not-allowed; }
        .song-page-status { color:var(--muted); font-size:13px; }
        .song-picker-search { margin-bottom:9px; }
        .song-picker { display:grid; max-height:230px; gap:6px; overflow-y:auto; padding:8px; border:1px solid var(--line); border-radius:11px; background:#f8faff; }
        .song-picker-option { display:flex; align-items:center; gap:9px; min-height:38px; padding:7px 9px; border:1px solid transparent; border-radius:8px; background:#fff; color:var(--ink); font-size:13px; cursor:pointer; }
        .song-picker-option:hover { border-color:#cbd8f1; background:#f0f4ff; }
        .song-picker-option input { width:16px; height:16px; flex:0 0 auto; margin:0; accent-color:var(--blue); }
        .song-picker-empty { margin:0 !important; padding:10px; color:var(--muted); font-size:13px; }
        .feed-image { display:block; max-width:min(100%,520px); max-height:320px; margin-top:10px; border-radius:10px; object-fit:contain; }
        .audit-pagination { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:12px; }
        .audit-pagination button { min-height:36px; padding:0 13px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--navy); font:inherit; font-weight:700; cursor:pointer; }
        .audit-pagination button:disabled { opacity:.45; cursor:not-allowed; }
        .audit-page-status { color:var(--muted); font-size:13px; }
        .pending-dialog { width:min(92vw,620px); max-height:min(82vh,760px); overflow:auto; border:1px solid rgba(255,255,255,.82); border-radius:22px; padding:0; color:var(--ink); box-shadow:0 28px 90px rgba(0,14,41,.32); }
        .pending-dialog::backdrop { background:rgba(0,10,30,.62); backdrop-filter:blur(5px); }
        .pending-dialog-content { padding:clamp(22px,5vw,34px); }
        .pending-dialog-heading { display:flex; align-items:center; gap:15px; margin-bottom:18px; }
        .pending-dialog-icon { display:grid; width:48px; height:48px; flex:0 0 auto; place-items:center; border-radius:15px; background:#fff5d8; color:#9a6700; font-size:23px; }
        .pending-dialog-title { min-width:0; }
        .pending-dialog-title h2 { margin:0; color:var(--navy); font-size:clamp(22px,4vw,28px); }
        .pending-dialog-count { display:inline-flex; align-items:center; min-height:23px; margin-top:6px; padding:2px 9px; border-radius:999px; background:#fff5d8; color:#805600; font-size:12px; font-weight:800; }
        .pending-dialog-description { margin:0 0 18px !important; color:var(--muted); line-height:1.6; }
        .pending-dialog .feed-list { max-height:42vh; overflow:auto; margin:0 0 18px; padding-right:3px; }
        .pending-dialog .feed-card { padding:15px 16px; border-radius:14px; box-shadow:0 4px 14px rgba(32,54,111,.05); }
        .pending-dialog form { display:flex; justify-content:flex-end; padding-top:15px; border-top:1px solid var(--line); }
        .pending-dialog .action-button { min-width:105px; }
        .song-detail-dialog { width:min(92vw,680px); max-height:min(84vh,760px); overflow:auto; border:1px solid var(--line); border-radius:18px; padding:24px; color:var(--ink); box-shadow:0 28px 90px rgba(0,14,41,.32); }
        .song-detail-dialog::backdrop { background:rgba(0,10,30,.62); backdrop-filter:blur(5px); }
        .song-detail-dialog h2 { margin:0 0 5px; color:var(--navy); }
        .song-detail-dialog .song-detail-content { display:grid; gap:12px; margin-top:18px; }
        .song-detail-dialog .song-lyrics-content { margin:0; padding:13px; border:1px solid var(--line); border-radius:11px; background:#f8faff; white-space:pre-wrap; color:var(--muted); }
        .song-detail-dialog form { display:flex; justify-content:flex-end; margin-top:18px; }
