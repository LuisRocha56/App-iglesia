<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000e29">
    <title>Mi Iglesia - Crear cuenta</title>
    <style>
        :root {
            color-scheme: light;
            --blue: #2929fd;
            --blue-dark: #1717c9;
            --navy: #000e29;
            --steel: #bcd7f7;
            --ink: #000e29;
            --muted: #71809a;
            --line: #dfe8f4;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            background:
                radial-gradient(ellipse at 7% 12%, rgba(41,41,253,.85), transparent 30%),
                radial-gradient(ellipse at 93% 90%, rgba(41,41,253,.58), transparent 34%),
                var(--navy);
            color: var(--ink);
            font-family: Inter, 'Segoe UI', Arial, sans-serif;
        }

        .page-card {
            display: grid;
            width: min(100%, 920px);
            min-height: min(500px, calc(100vh - 48px));
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 0;
            padding: 20px;
            overflow: hidden;
            border: 1px solid rgba(188,215,247,.48);
            border-radius: 28px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(0,0,0,.32);
        }

        .side-panel {
            position: relative;
            display: flex;
            min-height: 460px;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(28px, 4vw, 54px);
            overflow: hidden;
            isolation: isolate;
            border-radius: 23px;
            background:
                radial-gradient(ellipse at 13% 23%, rgba(41,41,253,.92), transparent 35%),
                radial-gradient(ellipse at 47% 83%, rgba(34,117,245,.78), transparent 41%),
                linear-gradient(145deg, #000719 0%, var(--navy) 60%, #001b43 100%);
            color: #fff;
        }

        .side-panel::before,
        .side-panel::after {
            position: absolute;
            z-index: -1;
            bottom: -12%;
            width: 24%;
            height: 58%;
            content: '';
            background: linear-gradient(0deg, rgba(188,215,247,.42), rgba(41,41,253,.72) 35%, rgba(41,41,253,.02) 100%);
            filter: blur(24px);
            opacity: .8;
        }

        .side-panel::before { left: 8%; transform: skewY(-8deg); }
        .side-panel::after { left: 32%; height: 47%; opacity: .52; transform: skewY(6deg); }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: .01em;
        }

        .brand-icon {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border: 1px solid rgba(255,255,255,.24);
            border-radius: 12px;
        }

        .brand-icon img {
            width: 27px;
            height: 27px;
            object-fit: contain;
        }

        .side-copy { max-width: 470px; padding-bottom: 9%; }

        .side-copy h1 {
            margin: 0;
            font-size: clamp(36px, 4.3vw, 59px);
            font-weight: 500;
            letter-spacing: -.045em;
            line-height: 1.11;
        }

        .side-copy p {
            max-width: 350px;
            margin: 19px 0 0;
            color: rgba(255,255,255,.73);
            font-size: 15px;
            line-height: 1.65;
        }

        .side-footer {
            color: rgba(255,255,255,.58);
            font-size: 12px;
            letter-spacing: .02em;
        }

        .form-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(20px, 1.8vw, 28px);
        }

        .form-box { width: min(100%, 410px); }

        .form-icon {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            margin-bottom: 7px;
        }

        .form-icon img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .form-box h2 {
            margin: 0;
            font-size: clamp(27px, 3vw, 34px);
            font-weight: 600;
            letter-spacing: -.04em;
        }

        .help-text {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .line {
            height: 1px;
            margin: 11px 0;
            border: 0;
            background: var(--line);
        }

        .field { margin: 0 0 7px; }

        .field label, .group-label {
            display: block;
            margin: 0 0 7px;
            color: #858585;
            font-size: 13px;
        }

        .field input {
            width: 100%;
            min-height: 40px;
            padding: 11px 14px;
            border: 1px solid #dedede;
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 14px;
            transition: border-color .15s, box-shadow .15s;
        }

        .field input:focus {
            outline: 0;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(41,41,253,.12);
        }

        .error-text {
            min-height: 16px;
            margin: 4px 0 7px;
            color: #c43b30;
            font-size: 13px;
            line-height: 1.4;
        }

        .submit-button {
            width: 100%;
            min-height: 42px;
            border: 0;
            border-radius: 10px;
            background: var(--blue);
            color: white;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(41,41,253,.24);
            transition: background .15s, transform .15s;
        }

        .submit-button:hover { background: var(--blue-dark); }
        .submit-button:active { transform: translateY(1px); }
        .submit-button:disabled { cursor: wait; opacity: .7; }

        .mode-text {
            margin: 8px 0 0;
            color: #929292;
            font-size: 13px;
            text-align: center;
        }

        .mode-text button {
            padding: 0;
            border: 0;
            background: none;
            color: var(--navy);
            font: inherit;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
        }

        @media (max-width: 760px) {
            body { padding: 14px; }
            .page-card {
                width: min(100%, 560px);
                min-height: 0;
                grid-template-columns: 1fr;
                padding: 10px;
                border-radius: 23px;
            }
            .side-panel {
                min-height: 165px;
                padding: 16px 20px;
                border-radius: 17px;
            }
            .brand-icon { width: 33px; height: 33px; }
            .side-copy { max-width: 400px; padding: 17px 0 0; }
            .side-copy h1 { max-width: 440px; font-size: clamp(28px, 8vw, 38px); }
            .side-copy p { display: none; }
            .side-footer { display: none; }
            .form-panel { padding: 20px clamp(16px, 6vw, 34px) 17px; }
            .form-icon { margin-bottom: 6px; }
            .line { margin: 13px 0; }
        }

        @media (max-width: 360px) {
            body { padding: 8px; }
            .page-card { padding: 8px; }
            .side-panel { min-height: 145px; padding: 14px; }
            .form-panel { padding: 17px 13px 14px; }
        }

        @media (max-height: 720px) and (min-width: 761px) {
            body { padding: 14px; }
            .page-card { min-height: calc(100vh - 28px); }
            .side-panel { min-height: 0; }
            .form-panel { padding-top: 26px; padding-bottom: 26px; }
            .line { margin: 17px 0; }
            .field { margin-bottom: 11px; }
        }
    </style>
</head>
<body>
    <main class="page-card">
        <aside class="side-panel">
            <div class="brand">
                <span class="brand-icon"><img src="src/images/Logo/LOGO_Blanco.png" alt=""></span>
                <span>Mi Iglesia</span>
            </div>
            <div class="side-copy">
                <h1>Una comunidad unida por la fe.</h1>
                <p>Conecta con tu congregación, comparte tus dones y sirve junto a tu comunidad.</p>
            </div>
            <div class="side-footer">Bienvenido a casa · Crecemos juntos</div>
        </aside>

        <section class="form-panel" aria-labelledby="formTitle">
            <div class="form-box">
                <div class="form-icon"><img src="src/images/Logo/LOGO_Bicolor.png" alt=""></div>
                <h2 id="formTitle">Crear cuenta</h2>
                <p class="help-text" id="formSubtitle">Bienvenido a Mi Iglesia. Comencemos.</p>
                <hr class="line">

                <form id="authForm" novalidate>
                    <div class="field" id="nameField">
                        <label for="nombre">Nombre completo</label>
                        <input id="nombre" name="nombre" type="text" autocomplete="name" maxlength="150">
                    </div>

                    <div class="field" id="phoneField">
                        <label for="telefono">Número de teléfono</label>
                        <input id="telefono" name="telefono" type="tel" autocomplete="tel" maxlength="30">
                    </div>

                    <div class="field">
                        <label for="email">Correo electrónico</label>
                        <input id="email" name="email" type="email" autocomplete="email" maxlength="255" required>
                    </div>

                    <div class="field">
                        <label for="password" id="passwordLabel">Crear contraseña</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
                    </div>

                    <p class="error-text" id="formMessage" role="alert" aria-live="polite"></p>
                    <button class="submit-button" id="submitButton" type="submit">Crear cuenta</button>
                </form>

                <p class="mode-text">
                    <span id="modePrompt">¿Ya tienes cuenta?</span>
                    <button id="modeToggle" type="button">Iniciar sesión</button>
                </p>
            </div>
        </section>
    </main>

    <script src="api-config.js"></script>
    <script src="app.js"></script>
    <script>
        const authForm = document.getElementById('authForm');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const nameField = document.getElementById('nameField');
        const phoneField = document.getElementById('phoneField');
        const passwordInput = document.getElementById('password');
        const passwordLabel = document.getElementById('passwordLabel');
        const formMessage = document.getElementById('formMessage');
        const submitButton = document.getElementById('submitButton');
        const modePrompt = document.getElementById('modePrompt');
        const modeToggle = document.getElementById('modeToggle');
        let mode = new URLSearchParams(window.location.search).get('modo') === 'login'
            ? 'login'
            : 'register';

        function setMode(nextMode, updateUrl = true) {
            mode = nextMode;
            const registering = mode === 'register';
            formTitle.textContent = registering ? 'Crear cuenta' : 'Iniciar sesión';
            formSubtitle.textContent = registering
                ? 'Bienvenido a Mi Iglesia. Comencemos.'
                : 'Qué bueno tenerte de vuelta.';
            nameField.hidden = !registering;
            phoneField.hidden = !registering;
            document.getElementById('nombre').required = registering;
            document.getElementById('telefono').required = registering;
            passwordInput.autocomplete = registering ? 'new-password' : 'current-password';
            passwordLabel.textContent = registering ? 'Crear contraseña' : 'Contraseña';
            passwordInput.minLength = registering ? 8 : 1;
            submitButton.textContent = registering ? 'Crear cuenta' : 'Iniciar sesión';
            modePrompt.textContent = registering ? '¿Ya tienes cuenta?' : '¿Aún no tienes cuenta?';
            modeToggle.textContent = registering ? 'Iniciar sesión' : 'Crear cuenta';
            formMessage.textContent = '';
            if (updateUrl) {
                const url = new URL(window.location.href);
                url.searchParams.set('modo', registering ? 'registro' : 'login');
                window.history.replaceState({}, '', url);
            }
        }

        modeToggle.addEventListener('click', () => {
            setMode(mode === 'register' ? 'login' : 'register');
        });

        async function restoreSession() {
            if (!MiIglesia.hasToken()) return;

            submitButton.disabled = true;
            submitButton.textContent = 'Comprobando sesión…';
            formMessage.textContent = 'Estamos comprobando si tu sesión sigue activa.';

            try {
                await MiIglesia.request('/api/auth/me');
                window.location.replace('Inicio.html');
            } catch (error) {
                if (error.status === 401) {
                    MiIglesia.clearToken();
                    formMessage.textContent = 'Tu sesión venció. Inicia sesión para continuar.';
                } else {
                    formMessage.textContent = 'No pudimos comprobar tu sesión. Intenta iniciar sesión de nuevo.';
                }
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = mode === 'register' ? 'Crear cuenta' : 'Iniciar sesión';
            }
        }

        authForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            formMessage.textContent = '';
            const formData = new FormData(authForm);
            const email = String(formData.get('email') || '').trim();
            const password = String(formData.get('password') || '');
            const payload = mode === 'register'
                ? {
                    nombre: String(formData.get('nombre') || '').trim(),
                    telefono: String(formData.get('telefono') || '').trim(),
                    email,
                    password,
                    category: 'congregation'
                }
                : { email, password };

            submitButton.disabled = true;
            submitButton.textContent = mode === 'register' ? 'Creando cuenta…' : 'Iniciando sesión…';
            try {
                const result = await MiIglesia.request(
                    mode === 'register' ? '/api/register' : '/api/login',
                    { method: 'POST', body: JSON.stringify(payload) }
                );
                MiIglesia.saveToken(result.token);
                window.location.assign('Inicio.html');
            } catch (error) {
                formMessage.textContent = error.message || 'No se pudo conectar con el servidor.';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = mode === 'register' ? 'Crear cuenta' : 'Iniciar sesión';
            }
        });

        setMode(mode, false);
        restoreSession();
    </script>
</body>
</html>
