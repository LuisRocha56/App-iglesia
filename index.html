<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000e29">
    <title>Mi Iglesia - Crear cuenta</title>
    <style>
        :root {
            color-scheme: light;
            --blue: #2929fd;
            --blue-dark: #1717c9;
            --navy: #000e29;
            --steel: #bcd7f7;
            --ink: #000e29;
            --muted: #71809a;
            --line: #dfe8f4;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            background:
                radial-gradient(ellipse at 7% 12%, rgba(41,41,253,.85), transparent 30%),
                radial-gradient(ellipse at 93% 90%, rgba(41,41,253,.58), transparent 34%),
                var(--navy);
            color: var(--ink);
            font-family: Inter, 'Segoe UI', Arial, sans-serif;
        }

        .auth-card {
            display: grid;
            width: min(100%, 1160px);
            min-height: min(680px, calc(100vh - 48px));
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 0;
            padding: 20px;
            overflow: hidden;
            border: 1px solid rgba(188,215,247,.48);
            border-radius: 28px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(0,0,0,.32);
        }

        .promo {
            position: relative;
            display: flex;
            min-height: 620px;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(28px, 4vw, 54px);
            overflow: hidden;
            isolation: isolate;
            border-radius: 23px;
            background:
                radial-gradient(ellipse at 13% 23%, rgba(41,41,253,.92), transparent 35%),
                radial-gradient(ellipse at 47% 83%, rgba(34,117,245,.78), transparent 41%),
                linear-gradient(145deg, #000719 0%, var(--navy) 60%, #001b43 100%);
            color: #fff;
        }

        .promo::before,
        .promo::after {
            position: absolute;
            z-index: -1;
            bottom: -12%;
            width: 24%;
            height: 58%;
            content: '';
            background: linear-gradient(0deg, rgba(188,215,247,.42), rgba(41,41,253,.72) 35%, rgba(41,41,253,.02) 100%);
            filter: blur(24px);
            opacity: .8;
        }

        .promo::before { left: 8%; transform: skewY(-8deg); }
        .promo::after { left: 32%; height: 47%; opacity: .52; transform: skewY(6deg); }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: .01em;
        }

        .brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border: 1px solid rgba(255,255,255,.24);
            border-radius: 12px;
            color: var(--steel);
            font-size: 22px;
        }

        .promo-copy { max-width: 470px; padding-bottom: 9%; }

        .promo-copy h1 {
            margin: 0;
            font-size: clamp(36px, 4.3vw, 59px);
            font-weight: 500;
            letter-spacing: -.045em;
            line-height: 1.11;
        }

        .promo-copy p {
            max-width: 350px;
            margin: 19px 0 0;
            color: rgba(255,255,255,.73);
            font-size: 15px;
            line-height: 1.65;
        }

        .promo-foot {
            color: rgba(255,255,255,.58);
            font-size: 12px;
            letter-spacing: .02em;
        }

        .form-side {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(28px, 5vw, 72px);
        }

        .form-content { width: min(100%, 410px); }

        .sun-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            margin-bottom: 17px;
            color: var(--blue);
            font-size: 40px;
            line-height: 1;
        }

        .form-content h2 {
            margin: 0;
            font-size: clamp(29px, 3vw, 38px);
            font-weight: 600;
            letter-spacing: -.04em;
        }

        .subtitle {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .divider {
            height: 1px;
            margin: 25px 0 23px;
            border: 0;
            background: var(--line);
        }

        .field { margin: 0 0 15px; }

        .field label, .group-label {
            display: block;
            margin: 0 0 7px;
            color: #858585;
            font-size: 13px;
        }

        .field input {
            width: 100%;
            min-height: 47px;
            padding: 11px 14px;
            border: 1px solid #dedede;
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 14px;
            transition: border-color .15s, box-shadow .15s;
        }

        .field input:focus {
            outline: 0;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(41,41,253,.12);
        }

        .category-field { margin: 3px 0 16px; }

        .category-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .category-option {
            display: flex;
            min-height: 43px;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            color: #575757;
            font-size: 12px;
            cursor: pointer;
        }

        .category-option:has(input:checked) {
            border-color: var(--blue);
            background: #f1f6ff;
            color: var(--navy);
        }

        .category-option input { accent-color: var(--blue); }

        .message {
            min-height: 19px;
            margin: 7px 0 10px;
            color: #c43b30;
            font-size: 13px;
            line-height: 1.4;
        }

        .submit {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 10px;
            background: var(--blue);
            color: white;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(41,41,253,.24);
            transition: background .15s, transform .15s;
        }

        .submit:hover { background: var(--blue-dark); }
        .submit:active { transform: translateY(1px); }
        .submit:disabled { cursor: wait; opacity: .7; }

        .mode-switch {
            margin: 15px 0 0;
            color: #929292;
            font-size: 13px;
            text-align: center;
        }

        .mode-switch button {
            padding: 0;
            border: 0;
            background: none;
            color: var(--navy);
            font: inherit;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
        }

        @media (max-width: 760px) {
            body { padding: 14px; }
            .auth-card {
                width: min(100%, 560px);
                min-height: 0;
                grid-template-columns: 1fr;
                padding: 10px;
                border-radius: 23px;
            }
            .promo {
                min-height: 205px;
                padding: 20px 23px;
                border-radius: 17px;
            }
            .brand-mark { width: 33px; height: 33px; }
            .promo-copy { max-width: 400px; padding: 27px 0 0; }
            .promo-copy h1 { max-width: 440px; font-size: clamp(30px, 8vw, 42px); }
            .promo-copy p { display: none; }
            .promo-foot { display: none; }
            .form-side { padding: 27px clamp(16px, 6vw, 34px) 22px; }
            .sun-mark { margin-bottom: 10px; }
            .divider { margin: 19px 0; }
        }

        @media (max-width: 360px) {
            body { padding: 8px; }
            .auth-card { padding: 8px; }
            .promo { min-height: 175px; padding: 17px; }
            .form-side { padding-right: 13px; padding-left: 13px; }
            .category-options { grid-template-columns: 1fr; }
            .category-option { min-height: 39px; }
        }

        @media (max-height: 720px) and (min-width: 761px) {
            body { padding: 14px; }
            .auth-card { min-height: calc(100vh - 28px); }
            .promo { min-height: 0; }
            .form-side { padding-top: 26px; padding-bottom: 26px; }
            .divider { margin: 17px 0; }
            .field { margin-bottom: 11px; }
        }
    </style>
</head>
<body>
    <main class="auth-card">
        <aside class="promo">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">✳</span>
                <span>Mi Iglesia</span>
            </div>
            <div class="promo-copy">
                <h1>Una comunidad unida por la fe.</h1>
                <p>Conecta con tu congregación, comparte tus dones y sirve junto a tu comunidad.</p>
            </div>
            <div class="promo-foot">Bienvenido a casa · Crecemos juntos</div>
        </aside>

        <section class="form-side" aria-labelledby="formTitle">
            <div class="form-content">
                <div class="sun-mark" aria-hidden="true">✳</div>
                <h2 id="formTitle">Crear cuenta</h2>
                <p class="subtitle" id="formSubtitle">Bienvenido a Mi Iglesia. Comencemos.</p>
                <hr class="divider">

                <form id="authForm" novalidate>
                    <div class="field" id="nameField">
                        <label for="nombre">Nombre completo</label>
                        <input id="nombre" name="nombre" type="text" autocomplete="name" maxlength="150">
                    </div>

                    <div class="field" id="phoneField">
                        <label for="telefono">Número de teléfono</label>
                        <input id="telefono" name="telefono" type="tel" autocomplete="tel" maxlength="30">
                    </div>

                    <div class="category-field" id="categoryField">
                        <span class="group-label">¿A qué espacio perteneces?</span>
                        <div class="category-options">
                            <label class="category-option">
                                <input type="radio" name="category" value="congregation">
                                <span>Congregación</span>
                            </label>
                            <label class="category-option">
                                <input type="radio" name="category" value="worship">
                                <span>Miembros de alabanza</span>
                            </label>
                        </div>
                    </div>

                    <div class="field">
                        <label for="email">Correo electrónico</label>
                        <input id="email" name="email" type="email" autocomplete="email" maxlength="255" required>
                    </div>

                    <div class="field">
                        <label for="password" id="passwordLabel">Crear contraseña</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
                    </div>

                    <p class="message" id="formMessage" role="alert" aria-live="polite"></p>
                    <button class="submit" id="submitButton" type="submit">Crear cuenta</button>
                </form>

                <p class="mode-switch">
                    <span id="modePrompt">¿Ya tienes cuenta?</span>
                    <button id="modeToggle" type="button">Iniciar sesión</button>
                </p>
            </div>
        </section>
    </main>

    <script src="api-config.js"></script>
    <script src="app.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const authForm = document.getElementById('authForm');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const nameField = document.getElementById('nameField');
        const phoneField = document.getElementById('phoneField');
        const categoryField = document.getElementById('categoryField');
        const passwordInput = document.getElementById('password');
        const passwordLabel = document.getElementById('passwordLabel');
        const formMessage = document.getElementById('formMessage');
        const submitButton = document.getElementById('submitButton');
        const modePrompt = document.getElementById('modePrompt');
        const modeToggle = document.getElementById('modeToggle');
        let mode = params.get('modo') === 'login' ? 'login' : 'register';
        const initialGroup = params.get('grupo') === 'alabanza' ? 'worship' : 'congregation';
        const selectedCategory = document.querySelector(`input[name="category"][value="${initialGroup}"]`);
        if (selectedCategory) selectedCategory.checked = true;

        function setMode(nextMode, updateUrl = true) {
            mode = nextMode;
            const registering = mode === 'register';
            formTitle.textContent = registering ? 'Crear cuenta' : 'Iniciar sesión';
            formSubtitle.textContent = registering
                ? 'Bienvenido a Mi Iglesia. Comencemos.'
                : 'Qué bueno tenerte de vuelta.';
            nameField.hidden = !registering;
            phoneField.hidden = !registering;
            categoryField.hidden = !registering;
            document.getElementById('nombre').required = registering;
            document.getElementById('telefono').required = registering;
            passwordInput.autocomplete = registering ? 'new-password' : 'current-password';
            passwordLabel.textContent = registering ? 'Crear contraseña' : 'Contraseña';
            passwordInput.minLength = registering ? 8 : 1;
            submitButton.textContent = registering ? 'Crear cuenta' : 'Iniciar sesión';
            modePrompt.textContent = registering ? '¿Ya tienes cuenta?' : '¿Aún no tienes cuenta?';
            modeToggle.textContent = registering ? 'Iniciar sesión' : 'Crear cuenta';
            formMessage.textContent = '';
            if (updateUrl) {
                const url = new URL(window.location.href);
                url.searchParams.set('modo', registering ? 'registro' : 'login');
                window.history.replaceState({}, '', url);
            }
        }

        modeToggle.addEventListener('click', () => {
            setMode(mode === 'register' ? 'login' : 'register');
        });

        authForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            formMessage.textContent = '';
            const formData = new FormData(authForm);
            const email = String(formData.get('email') || '').trim();
            const password = String(formData.get('password') || '');
            const payload = mode === 'register'
                ? {
                    nombre: String(formData.get('nombre') || '').trim(),
                    telefono: String(formData.get('telefono') || '').trim(),
                    email,
                    password,
                    category: formData.get('category')
                }
                : { email, password };

            if (mode === 'register' && !payload.category) {
                formMessage.textContent = 'Elige Congregación o Miembros de alabanza.';
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = mode === 'register' ? 'Creando cuenta…' : 'Iniciando sesión…';
            try {
                const result = await MiIglesia.request(
                    mode === 'register' ? '/api/register' : '/api/login',
                    { method: 'POST', body: JSON.stringify(payload) }
                );
                MiIglesia.saveToken(result.token);
                window.location.assign('Inicio.html');
            } catch (error) {
                formMessage.textContent = error.message || 'No se pudo conectar con el servidor.';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = mode === 'register' ? 'Crear cuenta' : 'Iniciar sesión';
            }
        });

        setMode(mode, false);
    </script>
</body>
</html>
