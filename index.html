<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Iglesia - Login</title>
    <style>
        /* Estilos generales para centrar y hacer responsivo el fondo */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #FFFF;
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Contenedor principal de la tarjeta (Centrado y Responsivo) */
        .container {
            width: 100%;
            max-width: 350px;
            background: #f8f9fd;
            background: linear-gradient(
                0deg,
                rgb(255, 255, 255) 0%,
                rgb(244, 247, 251) 100%
            );
            border-radius: 40px;
            padding: 25px 35px;
            border: 5px solid rgb(255, 255, 255);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 20px 30px 30px -20px;
            box-sizing: border-box;
        }

        .heading {
            text-align: center;
            font-weight: 900;
            font-size: 30px;
            color: rgb(16, 137, 211);
        }

        .form {
            margin-top: 20px;
            
        }

        .form .input {
            width: 100%;
            background: white;
            border: none;
            padding: 15px 20px;
            border-radius: 20px;
            margin-top: 15px;
            box-shadow: #cff0ff 0px 10px 10px -5px;
            border-inline: 2px solid transparent;
            box-sizing: border-box;
        }

        .form .input::placeholder {
            color: rgb(170, 170, 170);
        }

        .form .input:focus {
            outline: none;
            border-inline: 2px solid #12b1d1;
        }

        .form .forgot-password {
            display: block;
            margin-top: 10px;
            margin-left: 10px;
        }

        .form .forgot-password a {
            font-size: 11px;
            color: #0099ff;
            text-decoration: none;
        }

        /* Mensaje de error dinámico */
        .error-message {
            color: #e74c3c;
            font-size: 12px;
            text-align: center;
            margin: 12px 0 0 0;
            font-weight: 600;
            min-height: 16px;
        }

        .form .login-button {
            display: block;
            width: 100%;
            font-weight: bold;
            background: linear-gradient(
                45deg,
                rgb(16, 137, 211) 0%,
                rgb(18, 177, 209) 100%
            );
            color: white;
            padding-block: 15px;
            margin: 20px auto 10px auto;
            border-radius: 20px;
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 20px 10px -15px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .form .login-button:hover {
            transform: scale(1.03);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 23px 10px -20px;
        }

        .form .login-button:active {
            transform: scale(0.95);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 15px 10px -10px;
        }

        .social-account-container {
            margin-top: 20px;
        }

        .social-account-container .title {
            display: block;
            text-align: center;
            font-size: 10px;
            color: rgb(170, 170, 170);
        }

        .social-account-container .social-accounts {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }

        .social-account-container .social-accounts .social-button {
            background: linear-gradient(45deg, rgb(0, 0, 0) 0%, rgb(112, 112, 112) 100%);
            border: 5px solid white;
            padding: 5px;
            border-radius: 50%;
            width: 40px;
            aspect-ratio: 1;
            display: grid;
            place-content: center;
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 12px 10px -8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .social-account-container .social-accounts .social-button .svg {
            fill: white;
            margin: auto;
        }

        .social-account-container .social-accounts .social-button:hover {
            transform: scale(1.2);
        }

        .social-account-container .social-accounts .social-button:active {
            transform: scale(0.9);
        }

        .agreement {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .agreement a {
            text-decoration: none;
            color: #0099ff;
            font-size: 9px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heading">Iniciar Sesión</div>
        
        <!-- Formulario con ID para controlar la validación -->
        <form class="form" id="loginForm">
            <input
                placeholder="Correo"
                id="email"
                name="email"
                type="email"
                class="input"
                required
            />
            <input
                placeholder="Contraseña"
                id="password"
                name="password"
                type="password"
                class="input"
                required
            />
            <span class="forgot-password"><a href="#">No recuerdo mi contraseña</a></span>
            
            <!-- Etiqueta donde se muestran los errores de validación -->
            <p id="errorMessage" class="error-message"></p>

            <button type="submit" class="login-button">Iniciar sesión</button>
        </form>

        <span class="agreement"><a href="Registrarme.html">Registrarme</a></span>

    <!-- Lógica de validación con JavaScript -->
    <script src="api-config.js"></script>
    <script src="app.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const emailValue = emailInput.value.trim();
            const passwordValue = passwordInput.value.trim();

            if (emailValue === '' || passwordValue === '') {
                errorMessage.textContent = 'Por favor, completa todos los campos.';
                return;
            }

            try {
                const result = await MiIglesia.request('/api/login', {
                    method: 'POST',
                    body: JSON.stringify({ email: emailValue, password: passwordValue })
                });

                MiIglesia.saveToken(result.token);
                window.location.href = 'Inicio.html';
            } catch (error) {
                errorMessage.textContent = error.message || 'No se pudo conectar con el servidor.';
            }
        });
    </script>
</body>
