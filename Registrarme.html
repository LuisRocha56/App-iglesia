<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Iglesia - Registrarme</title>
    <style>
        /* Estilos generales para centrar y hacer responsivo el fondo */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #FFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Contenedor principal de la tarjeta (Centrado y Responsivo) */
        .container {
            width: 100%;
            max-width: 350px;
            background: #f8f9fd;
            background: linear-gradient(
                0deg,
                rgb(255, 255, 255) 0%,
                rgb(244, 247, 251) 100%
            );
            border-radius: 40px;
            padding: 25px 35px;
            border: 5px solid rgb(255, 255, 255);
            /* Sombra corregida a 0px horizontal para que luzca perfectamente centrada */
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 20px 30px -10px;
            box-sizing: border-box;
        }

        .heading {
            text-align: center;
            font-weight: 900;
            font-size: 30px;
            color: rgb(16, 137, 211);
        }

        .form {
            margin-top: 20px;
        }

        .form .input {
            width: 100%;
            background: white;
            border: none;
            padding: 15px 20px;
            border-radius: 20px;
            margin-top: 15px;
            box-shadow: #cff0ff 0px 10px 10px -5px;
            border-inline: 2px solid transparent;
            box-sizing: border-box;
        }

        .form .input::placeholder {
            color: rgb(170, 170, 170);
        }

        .form .input:focus {
            outline: none;
            border-inline: 2px solid #12b1d1;
        }

        /* Mensaje de error dinámico */
        .error-message {
            color: #e74c3c;
            font-size: 12px;
            text-align: center;
            margin: 12px 0 0 0;
            font-weight: 600;
            min-height: 16px;
        }

        .form .login-button {
            display: block;
            width: 100%;
            font-weight: bold;
            background: linear-gradient(
                45deg,
                rgb(16, 137, 211) 0%,
                rgb(18, 177, 209) 100%
            );
            color: white;
            padding-block: 15px;
            margin: 20px auto 10px auto;
            border-radius: 20px;
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 20px 10px -15px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .form .login-button:hover {
            transform: scale(1.03);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 23px 10px -20px;
        }

        .form .login-button:active {
            transform: scale(0.95);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 15px 10px -10px;
        }

        .agreement {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .agreement a {
            text-decoration: none;
            color: #0099ff;
            font-size: 12px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 18px;
            color: #31539b;
            font-size: 13px;
            text-decoration: none;
        }

        .category-label {
            margin: 8px 0 0;
            color: #b47b10;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .08em;
            text-align: center;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <a class="back-link" href="index.html">← Volver a los apartados</a>
        <div class="heading">Registrarme</div>
        <p class="category-label" id="categoryLabel"></p>
        
        <form class="form" id="loginForm">
            <input
                placeholder="Nombre completo"
                id="nombre"
                type="text"
                class="input"
                required
            />
            <input
                placeholder="Número de teléfono"
                id="numeroTel"
                type="tel"
                class="input"
                required
            />
            <input
                placeholder="Correo"
                id="email"
                name="email"
                type="email"
                class="input"
                required
            />
            <input
                placeholder="Contraseña (mínimo 8 caracteres)"
                id="password"
                name="password"
                type="password"
                class="input"
                required
                minlength="8"
            />
            <input id="category" type="hidden" value="congregation" />
            
            <!-- Etiqueta donde se muestran los errores de validación -->
            <p id="errorMessage" class="error-message"></p>

            <input value="Registrarse" type="submit" class="login-button" />
        </form>
        <span class="agreement"><a id="loginLink" href="index.html">Ya tengo cuenta: iniciar sesión</a></span>
    </div>

    <!-- Lógica de validación con JavaScript -->
    <script src="api-config.js"></script>
    <script src="app.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
const nombreInput = document.getElementById('nombre');
const telefonoInput = document.getElementById('numeroTel');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const errorMessage = document.getElementById('errorMessage');
const params = new URLSearchParams(window.location.search);
const group = params.get('grupo') === 'alabanza' ? 'alabanza' : 'congregacion';
const category = group === 'alabanza' ? 'worship' : 'congregation';
const groupName = group === 'alabanza' ? 'Miembros de alabanza' : 'Congregación';
document.getElementById('category').value = category;
document.getElementById('categoryLabel').textContent = groupName;
document.getElementById('loginLink').href = `index.html?grupo=${encodeURIComponent(group)}&modo=login`;
document.title = `Registrarme - ${groupName}`;

loginForm.addEventListener('submit', async function(event) {
    event.preventDefault();

    const data = {
        nombre: nombreInput.value.trim(),
        telefono: telefonoInput.value.trim(),
        email: emailInput.value.trim(),
        password: passwordInput.value,
        category: category
    };

    if (!data.nombre || !data.telefono || !data.email || !data.password) {
        errorMessage.textContent = 'Por favor, completa todos los campos.';
        return;
    }

    try {
        const result = await MiIglesia.request('/api/register', {
            method: 'POST',
            body: JSON.stringify(data)
        });

        MiIglesia.saveToken(result.token);
        window.location.href = 'Inicio.html';
    } catch (error) {
        errorMessage.textContent = error.message || 'No se pudo conectar con el servidor.';
    }
});
    </script>
</body>
</html>
